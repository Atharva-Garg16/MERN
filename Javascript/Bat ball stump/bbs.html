<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="bbs.css">
    <title>cricket</title>
</head>

<body>
    <h1>Bat Ball Stump</h1>
    <button onclick="show('Bat')">Bat</button>
    <button onclick="show('Ball')">Ball</button>
    <button onclick="show('Stump')">Stump</button>
    <button onclick="localStorage.clear();resetScore();">Reset</button>
    <p id="result"></p>
    <p id="scoreboard"></p>
    <script>
        let score;
        let scoreStr = localStorage.getItem('score');
        function resetScore(ScoreStr) {
            score = JSON.parse(scoreStr) ||
            {
                win: 0,
                lose: 0,
                tie: 0,
            };
        }

        score.show = function () {
            return `wins=${this.win} lose=${this.lose} tie=${this.tie}`;
        };
        function computerChoice() {
            let choice = Math.random() * 3;
            if (choice < 1) {
                return "Bat";
            } else if (choice < 2) {
                return "Ball";
            } else {
                return "Stump";
            }
        }
        function getResult(userMove, computerMove) {
            if (userMove === computerMove) {
                score.tie += 1;
                return `Its a tie`;
            }
            else if (userMove === 'Bat') {
                if (computerMove === 'Ball') {
                    score.win += 1;
                    return 'User wins';
                }
                else {
                    score.lose += 1;
                    return 'computer wins';
                }
            }
            else if (userMove === 'Stump') {
                if (computerMove === 'Ball') {
                    score.lose += 1;
                    return 'Computer wins';
                }
                else {
                    score.win += 1;
                    return 'User wins';

                }
            }
            else {
                if (computerMove === 'Bat') {
                    score.lose += 1
                    return 'Comptuer wins';
                }
                else {
                    score.win += 1;
                    return "User wins";

                }
            }
        }
        function show(userMove) {

            let c = computerChoice();
            document.querySelector('#result').innerHTML = ` user: ${userMove} computer :${c} result: ${getResult(userMove, c)}`;
            document.querySelector('#scoreboard').innerHTML = score.show();
            localStorage.setItem('score', JSON.stringify(score));
        }


    </script>
</body>

</html>
