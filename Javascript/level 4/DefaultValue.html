<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Default Value Example</h1>
    <script>
        function greeting(name="Guest") {
            console.log("Namaste " + name + " uncle!");
        }
greeting("Rohit"); // Output: Namaste Rohit uncle!
greeting(); // Output: Namaste Guest uncle!
    </script>
</body>
</html>
