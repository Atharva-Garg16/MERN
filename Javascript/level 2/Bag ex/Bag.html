<body>

    <button class="green" onclick="cart+=2;document.querySelector('#Bag_value').innerHTML=`Your Bag has ${cart} items`;">Add 1+1 sale item</button>
    <script>
        let cart=0;
        document.querySelector('#Bag_value').innerHTML=`Your Bag has ${cart} items`;


    </script>
</body>
