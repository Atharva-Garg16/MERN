<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=10;
        let b=20;
        let c=a+b;
        console.log(c); // this will print 30
        let d=eval('a*b'); // this will evaluate the expression and return the result, which is 200. eval() is a function that takes a string as an argument and evaluates it as JavaScript code. It can be used to execute code that is generated dynamically, but it should be used with caution because it can execute any code, including malicious code.
        console.log(d);
    </script>
</body>
</html>
