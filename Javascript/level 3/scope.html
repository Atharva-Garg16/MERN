<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Scope in JavaScript</h1>
    <p>variables defined with let have block scope that is limited to the block in which they are defined we can reassign it within its scope</p> <hr>
            
    <script>
        var x = 10;
        console.log(x);
        // let a = 10;
        // console.log(a);
        {   var x = 20;
            console.log(x);
            let a = 20;
            console.log(a);
        }
        console.log(a);
        // This will throw an error because a is not defined outside the block
        console.log(x);
    </script>
</body>
</html>
