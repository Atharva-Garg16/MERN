<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <h1>Logical Operators</h1>
    <script>
        let a = 10;
        let b = 20;
        console.log(a > b && a < b); //  logical and
        console.log(a > b || a < b); // logical or
        console.log(!(a > b)); // logical not
    </script>
</body>
</html>
