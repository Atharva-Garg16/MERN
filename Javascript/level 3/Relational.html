<!DOCTYPE html>
<html lang="en">
<head>
    <title>Relational Operators</title>
</head>
<body>
    <h1>Relational Operators</h1>
    <script>
        console.log(5 > 3);
        console.log(5 < 3);
        console.log(5 >= 3);
        console.log(5 <= 3);
        console.log(5=='5.0');// this is true because of type coercion
        console.log(5==='5.0');// this is false because of strict equality operator 
        
        
    </script>
</body>
</html>
