<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>shorthand property</h2>
    <p>if property is comming from a variable with the same name than we can use the shorthand syntax</p>
    <script>
        let company="Mango";
        let price=667;
        let item_name="T-shirt";
        let product={
            company,
            price,
            item_name,
        }
        console.log(product.company);
        console.log(product.price);
        console.log(product.item_name);
    </script>
    
</body>
</html>
