<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Object Shortcuts</h1>
    <h2>Destructuring</h2>
    <script>
        let product={
            company:"Mango",
            price: 667,
            item_name: "T-shirt",
        };
        // destructuring
        let {company,price,item_name}=product;
        console.log(company);
        console.log(price);
        console.log(item_name);
    </script>
</body>
</html>
